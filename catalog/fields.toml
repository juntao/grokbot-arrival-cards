# Canonical traveller and trip fields shared by every arrival card.
#
# A card field (catalog/cards/*.toml) points at one of these keys. Resolving it once covers it on every card,
# so a passport number given for Singapore is never asked again for Japan.
#
# tier:
#   vault  - identity, stable for years. Lives in the traveller's Vault entry `Travel identity · GIVEN SURNAME`.
#            `vault_slot` is a native Contact info slot (name | address | phone | email) or `hint` (a key=value line).
#   recall - trip facts and preferences. Looked up in memory -> email -> calendar -> derived, in that order (`find`).
#            `save` = trip (the dated trip log) or preference (lasting memory).
#   ask    - declarations, answered fresh on every card. Never stored anywhere.

# ---------------------------------------------------------------- VAULT: identity

[[field]]
key = "full_name"
label = "Full name as in passport"
tier = "vault"
vault_slot = "name"

[[field]]
key = "surname"
label = "Surname / family name"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "given_names"
label = "Given name(s)"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "other_names"
label = "Other names used (former / alias), or 'none'"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "other_citizenship"
label = "Other countries / regions of citizenship, or 'none'"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "middle_name"
label = "Middle name, or 'none'"
tier = "vault"
vault_slot = "hint"
note = "Thailand has a separate box; when the passport prints one given-names line, split it only if the user says so."

[[field]]
key = "chinese_name"
label = "Name in Chinese characters (optional)"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "sex"
label = "Sex as in passport (F / M / X)"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "dob"
label = "Date of birth"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "nationality"
label = "Nationality (passport country)"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "birth_country"
label = "Country of birth"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "birth_city"
label = "City of birth"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "passport_no"
label = "Passport number"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "passport_country"
label = "Passport issuing country"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "passport_issue"
label = "Passport date of issue"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "passport_expiry"
label = "Passport date of expiry"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "passport_photo"
label = "Photo of the passport data page"
