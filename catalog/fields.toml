vault_slot = "hint"
note = "Collected at onboarding. Read once to fill the other identity fields; with the user's OK a copy is kept at /workspace/arrival-cards/identity/<GIVEN>_<SURNAME>_passport.jpg for China's upload step, and its path is the hint value."

[[field]]
key = "portrait_photo"
label = "Passport-style photo of the traveller's face"
tier = "vault"
vault_slot = "hint"
note = "Maldives needs an upload. With the user's OK a copy is kept at /workspace/arrival-cards/identity/<GIVEN>_<SURNAME>_portrait.jpg and its path is the hint value; a clear crop from the passport photo page is not acceptable."

[[field]]
key = "home_address"
label = "Home address (street, city, state or province)"
tier = "vault"
vault_slot = "address"

[[field]]
key = "emergency_contact"
label = "Emergency contact phone number, with country code (optional)"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "home_city"
label = "City of residence"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "home_state"
label = "State, province or prefecture of residence"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "home_country"
label = "Country of residence"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "mobile"
label = "Mobile number with country code"
tier = "vault"
vault_slot = "phone"

[[field]]
key = "email"
label = "Email address for the card"
tier = "vault"
vault_slot = "email"

[[field]]
key = "occupation"
label = "Occupation / job title"
tier = "vault"
vault_slot = "hint"

[[field]]
key = "visa"
label = "Visa or residence permit for this country (number, or 'none')"
tier = "vault"
vault_slot = "hint"
note = "Stored per destination as visa_CN / visa_JP / visa_TW / visa_KR / visa_TH / visa_ID / visa_NZ / visa_VN; 'none' when visa-exempt."

[[field]]
key = "etravel_login"
label = "Philippines eTravel account (email + password)"
tier = "vault"
vault_slot = "login"
note = "A Vault Login for etravel.gov.ph, created on the first Philippines card and filled into the page without the Bot seeing the password."

[[field]]
key = "vjw_login"
label = "Visit Japan Web account (email + password)"
tier = "vault"
vault_slot = "login"
note = "A Vault Login for vjw.digital.go.jp, filled into the page without the Bot seeing the password."

# ---------------------------------------------------------------- RECALL: trip facts and preferences

[[field]]
key = "arrival_date"
label = "Arrival date"
tier = "recall"
save = "trip"
find = "Flight e-ticket (local arrival date, not departure date) -> calendar flight event."

[[field]]
key = "arrival_flight"
label = "Arrival flight (airline code + number)"
tier = "recall"
save = "trip"
find = "E-ticket / airline confirmation; check for later schedule-change emails -> calendar event title."

[[field]]
key = "arrival_airport"
label = "Airport / port of arrival"
tier = "recall"
save = "trip"
find = "E-ticket arrival airport (IATA code)."

[[field]]
key = "origin"
label = "City / country of embarkation (last stop before arrival)"
tier = "recall"
save = "trip"
find = "E-ticket departure airport of the arriving flight segment."

[[field]]
key = "departure_date"
label = "Date leaving the country"
tier = "recall"
save = "trip"
find = "Onward or return flight e-ticket -> calendar -> hotel check-out date."

[[field]]
key = "departure_flight"
label = "Departure flight (airline code + number)"
tier = "recall"
save = "trip"
find = "Onward or return flight e-ticket -> calendar."

[[field]]
key = "next_destination"
label = "Next city / country after this one"
tier = "recall"
save = "trip"
find = "Arrival airport of the onward flight; usually home."

[[field]]
key = "stay_type"
label = "Accommodation type (hotel / residence / friends-relatives / transit / other)"
tier = "recall"
save = "trip"
find = "Hotel or Airbnb booking -> 'own address' preference in memory."

[[field]]
key = "stay_name"
label = "Hotel / host name"
tier = "recall"
save = "trip"
find = "Booking confirmation email (Booking.com, Agoda, Airbnb, Trip.com, hotel direct)."

[[field]]
key = "stay_address"
label = "Address of stay (with postal code)"
tier = "recall"
save = "trip"
find = "Booking confirmation email; hotel website if the email lacks the postal code."

[[field]]
key = "stay_phone"
label = "Phone number of the stay"
tier = "recall"
save = "trip"
find = "Booking confirmation email -> hotel website."

[[field]]
key = "purpose"
label = "Purpose of visit"
tier = "recall"
save = "preference"
find = "Calendar (meetings/conference => business) -> invitation emails -> memory preference 'usual purpose'."

[[field]]
key = "length_of_stay"
label = "Length of stay (days)"
tier = "recall"
save = "trip"
find = "Derived: departure_date - arrival_date."

[[field]]
key = "destination_cities"
label = "Cities to be visited in the country"
tier = "recall"
save = "trip"
find = "Hotel cities and calendar event locations within the trip dates."

[[field]]
key = "entry_policy"
label = "Entry basis (visa-free / visa / transit visa-free / residence permit)"
tier = "recall"
save = "trip"
find = "Derived from nationality + visa field + length of stay; confirm on the form when unsure."

[[field]]
key = "inviting_entity"
label = "Inviting company / person in the country (name, contact)"
tier = "recall"
save = "trip"
find = "Invitation letter or conference email; 'none' for tourism."

[[field]]
key = "host_contact"
label = "Relative / friend you are visiting: name and mobile"
tier = "recall"
save = "trip"
find = "Only when purpose is visiting relatives/friends: memory contacts -> calendar event attendees -> ask."

[[field]]
key = "local_phone"
label = "Local phone number in the destination country (if any)"
tier = "recall"
save = "preference"
find = "Memory (e.g. a China SIM / eSIM number) -> 'none'; optional."

[[field]]
key = "transit_cities"
label = "Cities transited inside the country"
tier = "recall"
save = "trip"
find = "Domestic connecting flights / train tickets in email within the trip dates; usually none."

[[field]]
key = "seat_number"
label = "Seat number on the arriving flight"
tier = "recall"
save = "trip"
find = "Boarding pass or check-in confirmation email; optional, leave empty before check-in."

[[field]]
key = "booking_ref"
label = "Airline booking reference (PNR)"
tier = "recall"
save = "trip"
find = "E-ticket or booking confirmation email: the 6-character code."

[[field]]
key = "resident_status"
label = "Do you live in the destination country, or intend to stay permanently?"
tier = "recall"
save = "trip"
find = "Derived: No to both for a visitor whose home country differs and who holds no residence visa; confirm on the form when unsure."

[[field]]
key = "origin_departure_date"
label = "Date the arriving flight departs from its origin"
tier = "recall"
save = "trip"
find = "E-ticket: the departure date of the flight that lands in the destination (can be the day before arrival)."

[[field]]
key = "companions"
label = "Travel companions on this trip"
tier = "recall"
save = "trip"
find = "Other passengers on the same e-ticket / booking -> memory 'usually travels with'."

# ---------------------------------------------------------------- ASK: declarations, fresh every time

[[field]]
key = "health_symptoms"
label = "Do you currently have fever, cough, breathing difficulty, rash or other symptoms of an infectious disease?"
tier = "ask"

[[field]]
key = "recent_travel_yf"
label = "Have you recently been in or passed through a yellow-fever-risk country (Singapore: Africa or Latin America in the last 6 days)? Which ones?"
tier = "ask"

[[field]]
key = "recent_travel_2y"
label = "Other countries or regions visited in the past two years (list them)"
tier = "ask"
note = "China asks this. The bot may *suggest* trips found in email/calendar as a starting list, but the user confirms."

[[field]]
key = "passport_lost"
label = "Has a passport of yours ever been lost or stolen?"
tier = "ask"

[[field]]
key = "signature"
label = "Signature (drawn on the screen)"
tier = "ask"
note = "China only; drawn by the user during a Take control hand-over."

[[field]]
key = "other_passport_name"
label = "Have you ever used a passport under a different name to enter this country?"
tier = "ask"

[[field]]
key = "deported_before"
label = "Ever been deported from, or refused entry to, this country?"
tier = "ask"

[[field]]
key = "criminal_conviction"
label = "Ever been convicted of a crime in any country?"
tier = "ask"

[[field]]
key = "prohibited_items"
label = "Carrying narcotics, firearms, swords, explosives or other prohibited/restricted items?"
tier = "ask"

[[field]]
key = "customs_family_count"
label = "Number of family members travelling with you (customs)"
tier = "ask"

[[field]]
key = "customs_over_allowance"
label = "Carrying goods beyond the duty-free allowance?"
tier = "ask"

[[field]]
key = "customs_commercial"
label = "Carrying commercial goods or samples?"
tier = "ask"

[[field]]
key = "customs_for_others"
label = "Carrying items on behalf of someone else?"
tier = "ask"

[[field]]
key = "customs_cash"
label = "Carrying cash / securities / precious metals above the declaration threshold?"
tier = "ask"

[[field]]
key = "customs_unaccompanied"
label = "Do you have unaccompanied baggage (shipped separately)?"
tier = "ask"

[[field]]
key = "customs_restricted"
label = "Carrying meat products, vegetables, fruit, animals or plants (restricted items)?"
tier = "ask"

[[field]]
key = "customs_gold"
label = "Carrying gold bullion or products of gold?"
tier = "ask"

[[field]]
key = "customs_goods_detail"
label = "Itemised goods to declare (alcohol bottles, cigarettes, perfume, other goods with value)"
tier = "ask"
note = "Only when a customs question is answered Yes."

[[field]]
key = "recent_travel_14d"
label = "Countries / territories where you stayed within two weeks before arrival (list them)"
tier = "ask"
note = "Thailand asks this. The bot may suggest trips found in email/calendar as a starting list, but the user confirms."

[[field]]
key = "yellow_fever_cert"
label = "Are you vaccinated against yellow fever, with a certificate (and its vaccination date)?"
tier = "ask"
note = "Cambodia always asks. Thailand asks only when a visited country, the boarding country or the nationality is on its yellow-fever list."

[[field]]
key = "recent_travel_21d"
label = "Country of origin, transit and other countries visited within 21 days before arrival (list them)"
tier = "ask"
note = "Indonesia asks this; at least the country the flight left from. The bot may suggest trips found in email/calendar, but the user confirms."

[[field]]
key = "other_passport_nationality"
label = "Have you ever used a passport of a different nationality to enter this country?"
tier = "ask"

[[field]]
key = "baggage_count"
label = "Number of bags arriving with you (checked and carry-on)"
tier = "ask"

[[field]]
key = "customs_declarable"
label = "Do you carry goods that must be declared to Customs (restricted items, cash over the limit, alcohol/tobacco or purchases over the allowance, trade goods)?"
tier = "ask"

[[field]]
key = "imei_devices"
label = "Bringing phones or tablets bought abroad to use on local mobile networks (IMEI registration)?"
tier = "ask"
note = "Indonesia: not required for foreign visitors staying under 90 days, but the question must still be answered."

[[field]]
key = "ebola_exposure"
label = "Ebola check: been in an affected country, in contact with a case or a funeral, or have symptoms?"
tier = "ask"
note = "Maldives shows this block only for certain origins."

[[field]]
key = "recent_travel_30d"
label = "Countries or territories you have been to in the last 30 days, including in transit (list them)"
tier = "ask"
note = "New Zealand asks this. The bot may suggest trips found in email/calendar, but the user confirms."

[[field]]
key = "medical_purpose"
label = "Are you coming for medical treatment or consultation, or to give birth?"
tier = "ask"

[[field]]
key = "deported_any_country"
label = "Have you ever been deported, removed, excluded or refused entry from any country?"
tier = "ask"

[[field]]
key = "prison_12_months"
label = "Have you ever been sentenced to 12 months or more in prison?"
tier = "ask"

[[field]]
key = "bio_food"
