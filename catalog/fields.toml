tier = "ask"

[[field]]
key = "bio_equipment"
label = "Bringing equipment or clothing used with animals, plants or water (gardening, beekeeping, fishing, water sport, diving)?"
tier = "ask"

[[field]]
key = "bio_outdoor_gear"
label = "Bringing used outdoor gear: footwear, tents, camping, hunting, hiking, golf or sports equipment? (Used on farms or in the wild?)"
tier = "ask"

[[field]]
key = "bio_farm_contact"
label = "In the past 30 days, visited wilderness areas, had contact with animals (not pet cats and dogs), or visited farms or plant or animal processing sites?"
tier = "ask"

[[field]]
key = "customs_medicine"
label = "Carrying more than 3 months' supply of medicine, or medicine not prescribed to you?"
tier = "ask"

[[field]]
key = "customs_alcohol"
label = "Carrying alcohol over the allowance (NZ: 3 bottles of spirits and 4.5 litres of wine or beer)?"
tier = "ask"

[[field]]
key = "customs_tobacco"
label = "Carrying tobacco over the allowance (NZ: 50 cigarettes or 50 grams)?"
tier = "ask"

[[field]]
key = "baggage_known"
label = "Do you know the contents of your baggage?"
tier = "ask"

[[field]]
key = "recent_travel_6d"
label = "Countries visited in the last 6 days before arrival (list them, or none)"
tier = "ask"
